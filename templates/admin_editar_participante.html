{% extends "base.html" %}
{% block titulo %}Editar Participante{% endblock %}

{% block conteudo %}

<section class="panel panel-hero">
    <h1>Editar Participante</h1>
    <p class="muted">Atualize nome, e-mail, senha e permissão de administrador.</p>
</section>

<section class="panel">
    <form method="POST" action="{{ url_for('admin.editar_participante', id=participante.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-grid">
            <div class="form-row">
                <label>Nome completo *</label>
                <input type="text" name="nome" value="{{ participante.nome }}" required>
            </div>
            <div class="form-row">
                <label>E-mail *</label>
                <input type="email" name="email" value="{{ participante.email }}" required>
            </div>
            <div class="form-row">
                <label>Nova senha <span class="muted">(opcional)</span></label>
                <input type="password" name="senha" placeholder="Deixe em branco para manter a atual">
            </div>
        </div>

        <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.85rem; cursor:pointer; margin: 0.75rem 0 1.25rem;">
            <input type="checkbox" name="admin" style="width:auto;" {% if participante.admin %}checked{% endif %}>
            Conceder permissão de Administrador
        </label>

        <div class="form-actions">
            <button type="submit" class="button">Salvar Alterações</button>
            <a class="button secondary" href="{{ url_for('admin.listar_participantes') }}">Voltar</a>
        </div>
    </form>
</section>

{% endblock %}
