{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}

{% block conteudo %}
<section class="panel" style="max-width:420px; margin:2rem auto;">
    <h1 style="margin-bottom:1.5rem;">Criar conta</h1>

    <form method="POST">
        {% if config.WTF_CSRF_ENABLED %}
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% endif %}
        <div class="form-row">
            <label>Nome</label>
            <input type="text" name="nome" required autofocus>
        </div>
        <div class="form-row">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-row">
            <label>Senha</label>
            <input type="password" name="senha" required minlength="6">
        </div>
        <button type="submit" style="width:100%; margin-top:0.5rem;">Cadastrar</button>
    </form>

        <p class="muted" style="margin-top:1.25rem; text-align:center;">
        Já tem conta?
        <a href="{{ url_for('auth.login') }}" style="color:var(--dourado);">Entrar</a>
    </p>

    <div style="margin-top:1rem; text-align:center;">
        <a href="{{ url_for('auth.resetar_senha') }}" class="button small secondary" style="width:100%;">
            Esqueci minha senha
        </a>
    </div>
</section>
{% endblock %}
