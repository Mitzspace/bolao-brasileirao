{% if texto_copiavel %}
<section class="ui-panel" data-painel-copia>
    <div class="flex flex-wrap items-center gap-3">
        <button type="button" class="ui-button" data-copiar-texto>{{ rotulo_copiar }}</button>
        <p role="status" aria-live="polite" class="text-sm text-muted-foreground" data-status-copia></p>
    </div>
    <details class="mt-4" data-previa-copia>
        <summary class="cursor-pointer font-semibold">Conferir texto ou copiar manualmente</summary>
        <div class="ui-field mt-4">
            <label for="texto-whatsapp">Texto para WhatsApp</label>
            <textarea id="texto-whatsapp" rows="10" readonly data-texto-copia>{{ texto_copiavel }}</textarea>
        </div>
    </details>
    <p class="mt-2 text-sm text-muted-foreground">O texto é preparado com os dados desta página. Atualize a página após corrigir resultados.</p>
</section>
{% endif %}
