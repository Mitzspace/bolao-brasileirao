{% extends "base.html" %}
{% block titulo %}{{ 'Editar Campeonato' if campeonato else 'Novo Campeonato' }}{% endblock %}
{% block conteudo %}
<section class="panel panel-hero">
    <h1>{{ 'Editar Campeonato' if campeonato else 'Novo Campeonato' }}</h1>
    <p class="muted">Informe o nome do campeonato e a temporada exibida nas páginas.</p>
</section>
<section class="panel" style="max-width:480px;">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-row">
            <label>Nome do Campeonato</label>
            <input type="text" name="nome" value="{{ campeonato.nome if campeonato else '' }}" required autofocus>
        </div>
        <div class="form-row">
            <label>Temporada</label>
            <input type="number" name="ano" value="{{ campeonato.ano if campeonato else '' }}" required>
        </div>
        <div class="form-actions">
            <button type="submit">{{ 'Salvar Alterações' if campeonato else 'Salvar Campeonato' }}</button>
            <a class="button secondary" href="{{ url_for('admin.listar_campeonatos') }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
