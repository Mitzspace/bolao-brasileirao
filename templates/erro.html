<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} · Gestão de bolões</title>
{% include '_icones.html' %}
    <style>
        :root { --fundo: #f9fafb; --cartao: #fff; --texto: #111827; --suave: #6b7280; --marca: #059669; --borda: #f3f4f6; }
        @media (prefers-color-scheme: dark) { :root { --fundo: #030712; --cartao: #111827; --texto: #f9fafb; --suave: #9ca3af; --borda: #1f2937; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--fundo);
               color: var(--texto); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
        main { width: 100%; max-width: 420px; background: var(--cartao); border: 1px solid var(--borda); border-radius: 16px;
               padding: 32px 24px; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
        .codigo { font-size: 13px; font-weight: 700; color: var(--marca); letter-spacing: .08em; }
        h1 { font-size: 20px; margin: 8px 0; }
        p { color: var(--suave); font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
        a { display: inline-block; background: var(--marca); color: #fff; text-decoration: none; font-weight: 600;
            font-size: 14px; padding: 10px 18px; border-radius: 12px; }
    </style>
</head>
<body>
    <main>
        <div class="codigo">ERRO {{ codigo }}</div>
        <h1>{{ titulo }}</h1>
        <p>{{ texto }}</p>
        {% if not sem_link %}<a href="{{ url_for('interface.index') }}">Voltar ao início</a>{% endif %}
    </main>
</body>
</html>
