{% extends "base.html" %}
{% block titulo %}Resetar Senha{% endblock %}

{% block conteudo %}
<section class="panel" style="max-width:420px; margin:2rem auto;">
    <h1 style="margin-bottom:1.5rem;">Resetar Senha</h1>

    <form method="POST">
        {% if config.WTF_CSRF_ENABLED %}
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% endif %}
        <div class="form-row">
            <label>Email</label>
            <input type="email" name="email" required autofocus>
        </div>
                <button type="submit" class="button" style="width:100%; margin-top:0.5rem;">Resetar Senha</button>
    </form>

    <p class="muted" style="margin-top:1.25rem; text-align:center;">
        Lembrou sua senha?
        <a href="{{ url_for('auth.login') }}" style="color:var(--dourado);">Entrar</a>
    </p>
</section>
{% endblock %}
