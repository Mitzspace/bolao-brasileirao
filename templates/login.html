{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<section class="panel" style="max-width:420px; margin:2rem auto;">
    <h1 style="margin-bottom:1.5rem;">Entrar</h1>

    <form method="POST">
        {% if config.WTF_CSRF_ENABLED %}
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% endif %}
        <div class="form-row">
            <label>Email</label>
            <input type="email" name="email" required autofocus>
        </div>
        <div class="form-row">
            <label>Senha</label>
            <input type="password" name="senha" required>
        </div>
        <button type="submit" style="width:100%; margin-top:0.5rem;">Entrar</button>
    </form>

        <div style="margin-top:1.25rem; text-align:center;">
        <a href="{{ url_for('auth.resetar_senha') }}" class="button small secondary" style="width:100%;">
            Esqueci minha senha
        </a>
    </div>

    <p class="muted" style="margin-top:0.75rem; text-align:center;">
        Ainda não tem conta?
        <a href="{{ url_for('auth.cadastro') }}" style="color:var(--dourado);">Criar conta</a>
    </p>
</section>
{% endblock %}
